name: Image capability probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-genai
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai
          from google.genai import types
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          models = [m.name.replace('models/', '') for m in client.models.list()]
          print('IMAGE MODELS:', [m for m in models if 'image' in m])
          for model in ['gemini-2.5-flash-image', 'gemini-3.1-flash-image', 'gemini-3.1-flash-lite-image', 'gemini-2.0-flash-preview-image-generation']:
              try:
                  r = client.models.generate_content(
                      model=model,
                      contents='a lighthouse at dawn, photorealistic landscape',
                      config=types.GenerateContentConfig(response_modalities=['IMAGE', 'TEXT']),
                  )
                  ok = False
                  for c in getattr(r, 'candidates', []) or []:
                      for p in getattr(getattr(c, 'content', None), 'parts', []) or []:
                          inline = getattr(p, 'inline_data', None)
                          if inline and getattr(inline, 'data', None):
                              ok = True
                  print('RESULT', model, ok)
              except Exception as exc:
                  print('FAIL', model, str(exc)[:180])
          PY
